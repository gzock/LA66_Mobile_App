apply plugin: 'com.android.application'

android {
    namespace "com.sz.cp2102"
    compileSdkVersion 33
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.sz.cp2102"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 3
        versionName "1.02"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // 设置支持的SO库架构
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }
    signingConfigs {
        release {
            keyAlias 'key0'
            keyPassword '123456'
            storeFile file('../ble.jks')
            storePassword '123456'
        }
        debug {
            keyAlias 'key0'
            keyPassword '123456'
            storeFile file('../ble.jks')
            storePassword '123456'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.clj.fastble:FastBleLib:2.3.4'
    implementation 'pub.devrel:easypermissions:3.0.0'
    implementation 'com.qmuiteam:qmui:2.0.0-alpha10'
    //utils
    implementation 'com.blankj:utilcode:1.31.1'
    implementation 'me.jessyan:autosize:1.2.1'    //事件总线框架
    implementation 'org.greenrobot:eventbus:3.3.1'
    //各种弹框以及大图预览
    implementation 'com.lxj:xpopup:2.11.0'  //下拉刷新，上拉加载框架
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.3'
    implementation 'com.tencent.bugly:crashreport:4.1.9.3'
    implementation 'com.tencent.bugly:nativecrashreport:4.1.9'

    implementation('com.alibaba.android:ultraviewpager:1.0.7.7@aar') {
        transitive = true
    }
    implementation 'com.github.mik3y:usb-serial-for-android:3.4.6'
    implementation 'com.amap.api:3dmap:9.7.0'
    implementation 'com.amap.api:location:6.3.0'
    implementation 'com.amap.api:search:9.7.0'
    implementation 'androidx.multidex:multidex:2.0.1'
}